name: Aureus Pro Free Tier Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (cron format: */10 * * * *)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping-healthz:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Aureus Pro Health Endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL || 'https://aureus-pro.onrender.com' }}"
          echo "Pinging $RENDER_URL/healthz..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/healthz")
          echo "HTTP Response Status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Warning: Health endpoint returned non-200 status $RESPONSE"
          else
            echo "Aureus Pro is warm and healthy."
          fi
